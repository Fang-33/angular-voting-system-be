services:
  db:
    image: postgres:13
    container_name: voting_db
    restart: always
    environment:
      TZ: Asia/Taipei
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: voting_system
    volumes:
      - ./data/:/var/lib/postgresql/data
    ports:
      - "15432:5432"

  server:
    build: .
    image: voting-system
    restart: always
    container_name: voting_system
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/voting_system"
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    command: npm run dev